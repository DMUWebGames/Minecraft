<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- La librairie de maths 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/3.4.2/gl-matrix-min.js"></script>
    <script src="main.js" type="module" defer></script>
    <title>WebGPU Minecraft</title>
</head>
<body>
    
    <canvas id="webgpu-canvas"></canvas>

    <!-- VIEWFINDER -->
    <div id="crosshair"></div>
    <!-- Dans index.html, ajouter un petit div-->
    <div id="debug-coords" style="position:fixed; top:10px; left:10px; color:white; font-family:monospace; background:rgba(0,0,0,0.5); padding:5px;"></div>

    <div id="main-menu" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 40px; border-radius: 10px; text-align: center; color: white; z-index: 100;">
        <h1>Minecraft WebGPU</h1>
        <br><br>
        <button onclick="startSolo()" style="padding: 15px 30px; font-size: 20px; cursor: pointer;">Jouer en Solo</button>
        <br><br>
        <button onclick="startMulti()" style="padding: 15px 30px; font-size: 20px; cursor: pointer; background: #28a745;">Rejoindre une partie</button>
    </div>

    <div id="hotbar">
        <div class="slot active" id="slot-1">
            <div class="block-preview" style="background:#3a9d23"></div>
            <span>1</span>
        </div>
        <div class="slot" id="slot-2">
            <div class="block-preview" style="background: url('textures/dirt.png') center/cover;"></div>
            <span>2</span>
        </div>
        <div class="slot" id="slot-3">
            <div class="block-preview" style="background: url('textures/stone.png') center/cover;"></div>
            <span>3</span>
        </div>
        <div class="slot" id="slot-4">
            <div class="block-preview" style="background: url('textures/wood.png') center/cover;"></div>
            <span>4</span>
        </div>
        <div class="slot" id="slot-5">
            <div class="block-preview" style="background:#FFD700"></div>
            <span>5</span>
        </div>
        <div class="slot" id="slot-6">
            <div class="block-preview" style="background: rgba(200, 230, 255, 0.5); border: 2px solid white;"></div>
            <span>6</span>
        </div>
        <div class="slot" id="slot-7">
            <div class="block-preview" style="background: url('textures/water.png') center/cover;"></div>
            <span>7</span>
        </div>
        <div class="slot" id="slot-8">
            <div class="block-preview" style="background: #1f5611"></div>
            <span>8</span>
        </div>
    </div>

</body>
</html>
