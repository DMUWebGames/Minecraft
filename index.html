<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- La librairie de maths 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/3.4.2/gl-matrix-min.js"></script>
    <script src="main.js" type="module" defer></script>
    <title>WebGPU Minecraft</title>
</head>
<body>
    
    <canvas id="webgpu-canvas"></canvas>

    <!-- VIEWFINDER -->
    <div id="crosshair"></div>

    <div id="hotbar">
        <div class="slot active" id="slot-1">
            <div class="block-preview" style="background:#3a9d23"></div>
            <span>1</span>
        </div>
        <div class="slot" id="slot-2">
            <div class="block-preview" style="background:#8b5a2b"></div>
            <span>2</span>
        </div>
        <div class="slot" id="slot-3">
            <div class="block-preview" style="background:#808080"></div>
            <span>3</span>
        </div>
        <div class="slot" id="slot-4">
            <div class="block-preview" style="background:#5c4033"></div>
            <span>4</span>
        </div>
        <div class="slot" id="slot-5">
            <div class="block-preview" style="background:#FFD700"></div>
            <span>5</span>
        </div>
    </div>

</body>
</html>
